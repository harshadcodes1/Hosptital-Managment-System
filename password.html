{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block heading %}Change password{% endblock %}
{% block content %}
<form method="post" class="card" style="max-width:460px;display:flex;flex-direction:column;gap:16px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Current password<input type="password" name="old_password" required></label>
  <label>New password (6+ characters)<input type="password" name="new_password" minlength="6" required></label>
  <div class="form-actions"><button class="btn" type="submit">Save password</button><a class="btn ghost" href="{{ url_for('dashboard') }}">Cancel</a></div>
</form>
{% endblock %}
